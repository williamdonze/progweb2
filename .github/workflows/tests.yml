name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Playwright et Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Valider le contenu
        run: python3 tools/valider-contenu.py
      - name: Tester chaque exercice (solutions et erreurs typiques)
        run: python3 tools/tester-exercices.py
      - name: Parcours complet
        run: python3 tools/test-parcours.py
